[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comicload"
version = "0.1.0"
description = "Photograph comic covers, identify them, catalogue them in League of Comic Geeks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "pillow>=10.3",
    "pyzbar>=0.1.9",
    "tomli-w>=1.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
locg = ["playwright>=1.44"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
comicload = "comicload.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comicload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type swigvarlink:DeprecationWarning",
    "ignore:builtin type Swig:DeprecationWarning",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/comicload"]

[[tool.mypy.overrides]]
module = "pyzbar.*"
ignore_missing_imports = true

# The Playwright sink is Phase 4. The CLI imports it inside a try/except so that
# `--import-locg` fails with an install instruction instead of a traceback; until the
# module exists, mypy cannot resolve it.
[[tool.mypy.overrides]]
module = "comicload.infra.sinks.locg_sink"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymupdf ships no type stubs; its calls are untyped in our strict context.
module = "comicload.ingestion.pdf"
disallow_untyped_calls = false
